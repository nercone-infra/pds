services:
  ruconet:
    container_name: pds-ruconet
    image: ghcr.io/nercone-infra/ruconet-node:latest
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
      net.ipv4.conf.all.rp_filter: 2
    dns:
      - 127.0.0.1
    dns_opt:
      - trust-ad
    environment:
      - RUCONET_NAME=pds
      - RUCONET_PRIVATE_KEY=${RUCONET_PRIVATE_KEY:?RUCONET_PRIVATE_KEY is required}
      - RUCONET_PRESHARED_KEY=${RUCONET_PRESHARED_KEY:?RUCONET_PRESHARED_KEY is required}
      - RUCONET_HUB_PUBLIC_KEY=${RUCONET_HUB_PUBLIC_KEY:?RUCONET_HUB_PUBLIC_KEY is required}
    healthcheck:
      test: ["CMD", "/usr/local/bin/ruconet-node", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cert:
    container_name: pds-cert
    image: ghcr.io/nercone-infra/ruconet-cert:latest
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    network_mode: service:ruconet
    volumes:
      - ./data/certs:/etc/certs
    environment:
      - CERT_BUNDLES=ruconet
    healthcheck:
      test: ["CMD", "/usr/local/bin/cert-agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      ruconet:
        condition: service_started
        restart: true

  tls:
    container_name: pds-tls
    image: ghcr.io/nercone-infra/ruconet-tls:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    network_mode: service:ruconet
    volumes:
      - ./tls:/etc/nginx.d:ro
      - ./data/certs:/etc/certs:ro
    depends_on:
      ruconet:
        condition: service_started
        restart: true

  pds:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:0.4
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    network_mode: service:ruconet
    volumes:
      - ./data/pds:/pds
    environment:
      - PDS_HOSTNAME=pds.nercone.dev
      - PDS_JWT_SECRET=${PDS_JWT_SECRET}
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_BLOB_UPLOAD_LIMIT=314572800
      - PDS_DID_PLC_URL=https://plc.directory
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_REPORT_SERVICE_URL=https://mod.bsky.app
      - PDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true
      - PDS_RATE_LIMITS_ENABLED=true
      - PDS_INVITE_REQUIRED=true
      - PDS_EMAIL_SMTP_URL=smtp://pds%40nercone.dev:${PDS_EMAIL_SMTP_PASSWORD}@127.0.0.1:587/
      - PDS_EMAIL_FROM_ADDRESS=pds@nercone.dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/xrpc/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      ruconet:
        condition: service_started
        restart: true
